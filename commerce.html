<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halcyon Retail Group</title>
<style>
/* ============================================================
   Halcyon Retail Group - demo platform
   Order to cash across three systems.
   Single file. No network. Fixed clock. Local storage only.
   ============================================================ */

:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f7f9fb; --surface-3:#eef2f7;
  --ink-1:#0e1726; --ink-2:#3a4657; --ink-3:#58657a;
  --line:#dbe2ec; --line-2:#c6d0de;
  --primary:#1f3a8a; --primary-hover:#16296b; --primary-ink:#ffffff;
  --accent:#e0a63c; --accent-hover:#c98f22; --accent-ink:#231604;
  --ok:#15683f; --ok-soft:#e4f4ec;
  --warn:#8a5a00; --warn-soft:#fdf2dc;
  --risk:#a01c28; --risk-soft:#fbe6e8;
  --info:#1b5a86; --info-soft:#e3f1f9;
  --shop:#a21caf; --shop-soft:#fae8ff; --shop-ink:#ffffff;
  --pop-violet:#7c3aed; --pop-violet-d:#6d28d9;
  --pop-pink:#db2777;   --pop-pink-d:#be185d;
  --pop-cyan:#0e7490;   --pop-amber:#c2410c;
  --pop-ink:#ffffff;
  --hero-1:#ede9fe; --hero-2:#fce7f3; --hero-3:#cffafe;
  --glass:rgba(255,255,255,.74); --glass-line:rgba(124,58,237,.18);
  --erp:#1f4b78; --erp-soft:#e4eef8; --erp-ink:#ffffff;
  --wms:#1f6b4d; --wms-soft:#e2f3ec; --wms-ink:#ffffff;
  --focus:#2563eb;
  --radius:10px; --radius-s:6px;
  --shadow:0 1px 2px rgba(14,23,38,.06),0 4px 14px rgba(14,23,38,.06);
  --shadow-lg:0 10px 34px rgba(14,23,38,.14);
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0b1017; --surface:#131b26; --surface-2:#18212e; --surface-3:#1f2a39;
  --ink-1:#eef3fa; --ink-2:#c2cddc; --ink-3:#96a3b6;
  --line:#26303f; --line-2:#33404f;
  --primary:#6f92e8; --primary-hover:#8aa8f0; --primary-ink:#0b1017;
  --accent:#e0a63c; --accent-hover:#eeba5b; --accent-ink:#0b1017;
  --ok:#57c98d; --ok-soft:#10301f;
  --warn:#e0b25c; --warn-soft:#2e2413;
  --risk:#ef8a94; --risk-soft:#34151a;
  --info:#7cc0e8; --info-soft:#122736;
  --shop:#f0abfc; --shop-soft:#3b0764; --shop-ink:#1b0b2e;
  --pop-violet:#a78bfa; --pop-violet-d:#c4b5fd;
  --pop-pink:#f472b6;   --pop-pink-d:#f9a8d4;
  --pop-cyan:#67e8f9;   --pop-amber:#fbbf24;
  --pop-ink:#1b0b2e;
  --hero-1:#241338; --hero-2:#2e1226; --hero-3:#0e2a33;
  --glass:rgba(19,27,38,.74); --glass-line:rgba(167,139,250,.24);
  --erp:#89b6e6; --erp-soft:#132434; --erp-ink:#0b1017;
  --wms:#79cfa8; --wms-soft:#10291f; --wms-ink:#0b1017;
  --focus:#7aa2ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  --shadow-lg:0 10px 34px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink-1);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary)}
h1,h2,h3,h4{margin:0 0 .5rem; line-height:1.25; font-weight:650}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem} h4{font-size:.95rem}
p{margin:0 0 .75rem}
.muted{color:var(--ink-3)}
.small{font-size:.82rem}
.mono{font-family:var(--mono); font-size:.86em; letter-spacing:.01em}
.nowrap{white-space:nowrap}
.right{text-align:right}
.center{text-align:center}
.hidden{display:none !important}
.stack>*+*{margin-top:.75rem}
.row{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center}
.row-end{display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; justify-content:flex-end}
.spacer{flex:1 1 auto}
.wrap{max-width:1240px; margin:0 auto; padding:0 20px}
.wrap-wide{max-width:1560px; margin:0 auto; padding:0 20px}

/* ---------- focus ---------- */
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  padding:.55rem .95rem; border-radius:var(--radius-s); cursor:pointer;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-1);
  font:inherit; font-weight:600; font-size:.9rem; text-decoration:none;
  transition:background .12s ease,border-color .12s ease,color .12s ease;
}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55; cursor:not-allowed}
.btn-primary{background:var(--primary); border-color:var(--primary); color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-hover); border-color:var(--primary-hover); color:var(--primary-ink)}
.btn-accent{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn-accent:hover{background:var(--accent-hover); border-color:var(--accent-hover); color:var(--accent-ink)}
.btn-ok{background:var(--ok); border-color:var(--ok); color:#ffffff}
:root[data-theme="dark"] .btn-ok{color:#06170e}
.btn-ok:hover{filter:brightness(1.08)}
.btn-danger{background:var(--surface); border-color:var(--line-2); color:var(--risk)}
.btn-danger:hover{background:var(--risk-soft); border-color:var(--risk); color:var(--risk)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-3); border-color:transparent; color:var(--ink-1)}
.btn-sm{padding:.34rem .6rem; font-size:.82rem}
.btn-lg{padding:.75rem 1.4rem; font-size:1rem}
.btn-block{width:100%}

/* ---------- forms ---------- */
.field{display:block; margin-bottom:.9rem}
.field>label,.lbl{display:block; font-weight:600; font-size:.85rem; margin-bottom:.28rem; color:var(--ink-2)}
.hint{font-size:.78rem; color:var(--ink-3); margin-top:.24rem}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=password],input[type=date],input[type=search],select,textarea{
  width:100%; padding:.52rem .65rem; font:inherit; font-size:.9rem;
  border:1px solid var(--line-2); border-radius:var(--radius-s);
  background:var(--surface); color:var(--ink-1);
}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%); background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:2rem}
textarea{min-height:84px; resize:vertical}
input:disabled,select:disabled,textarea:disabled{background:var(--surface-3); color:var(--ink-3)}
.err-field{border-color:var(--risk) !important}
.err-msg{color:var(--risk); font-size:.78rem; margin-top:.24rem; font-weight:600}
.check{display:flex; gap:.5rem; align-items:flex-start; font-size:.88rem; margin-bottom:.5rem}
.check input{margin-top:.2rem; width:16px; height:16px; flex:0 0 auto}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 .9rem}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 .9rem}
.grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:0 .9rem}
@media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* ---------- cards / panels ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-pad{padding:1.1rem 1.2rem}
.panel{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:.9rem 1rem}
.sect{margin:1.4rem 0}
.sect-head{display:flex; align-items:baseline; gap:.6rem; margin-bottom:.6rem}
.divider{height:1px; background:var(--line); margin:1rem 0; border:0}

/* ---------- badges ---------- */
.badge{display:inline-flex; align-items:center; gap:.3rem; padding:.16rem .5rem; border-radius:999px; font-size:.74rem; font-weight:700; letter-spacing:.02em; border:1px solid transparent}
.badge-ok{background:var(--ok-soft); color:var(--ok); border-color:var(--ok)}
.badge-warn{background:var(--warn-soft); color:var(--warn); border-color:var(--warn)}
.badge-risk{background:var(--risk-soft); color:var(--risk); border-color:var(--risk)}
.badge-info{background:var(--info-soft); color:var(--info); border-color:var(--info)}
.badge-neutral{background:var(--surface-3); color:var(--ink-2); border-color:var(--line-2)}

/* ---------- tables ---------- */
table.tbl{width:100%; border-collapse:collapse; font-size:.88rem}
table.tbl th{text-align:left; font-weight:700; font-size:.76rem; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); background:var(--surface-3); padding:.5rem .6rem; border-bottom:1px solid var(--line-2); white-space:nowrap}
table.tbl td{padding:.52rem .6rem; border-bottom:1px solid var(--line); vertical-align:top}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tfoot td{font-weight:700; border-top:2px solid var(--line-2)}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}

/* ---------- banners ---------- */
.banner{border-radius:var(--radius-s); padding:.7rem .9rem; font-size:.88rem; border:1px solid; margin-bottom:.9rem}
.banner-ok{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)}
.banner-warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn)}
.banner-risk{background:var(--risk-soft); border-color:var(--risk); color:var(--risk)}
.banner-info{background:var(--info-soft); border-color:var(--info); color:var(--info)}
.banner b{font-weight:800}

/* ---------- toast ---------- */
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:900; display:flex; flex-direction:column; gap:.5rem; align-items:center; pointer-events:none}
.toast{background:var(--ink-1); color:var(--bg); padding:.6rem 1rem; border-radius:999px; font-size:.86rem; font-weight:600; box-shadow:var(--shadow-lg); max-width:min(90vw,560px)}

/* ---------- top bar ---------- */
.topbar{position:sticky; top:0; z-index:500; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar-in{display:flex; align-items:center; gap:.9rem; padding:.6rem 20px; max-width:1560px; margin:0 auto}
.brandmark{display:flex; align-items:center; gap:.55rem; font-weight:800; letter-spacing:-.01em}
.brand-dot{width:26px; height:26px; border-radius:7px; display:grid; place-items:center; font-size:.76rem; font-weight:900; color:#fff}
.sys-name{font-size:.95rem}
.sys-sub{font-size:.72rem; color:var(--ink-3); font-weight:600; letter-spacing:.06em; text-transform:uppercase}
.navlinks{display:flex; gap:.15rem; flex-wrap:wrap}
.navlink{padding:.4rem .7rem; border-radius:var(--radius-s); font-size:.86rem; font-weight:600; color:var(--ink-2); cursor:pointer; border:1px solid transparent; background:transparent}
.navlink:hover{background:var(--surface-3); color:var(--ink-1)}
.navlink[aria-current="page"]{background:var(--surface-3); color:var(--ink-1); border-color:var(--line-2)}
.who{font-size:.8rem; color:var(--ink-2); text-align:right; line-height:1.3}
.who b{display:block; color:var(--ink-1)}

/* ---------- login ---------- */
/* The sign in page shares the launcher's brand surface so that the front
   door reads as one thing. background-color carries the darkest stop so a
   contrast check measures against what is actually rendered. */
.login-wrap{
  min-height:100vh; display:grid; place-items:center; padding:2.4rem 1rem;
  background-color:#1a1033;
  background-image:
    radial-gradient(760px 520px at 12% -14%, rgba(124,58,237,.55) 0%, transparent 58%),
    radial-gradient(720px 500px at 88% -8%, rgba(190,24,93,.45) 0%, transparent 56%),
    radial-gradient(820px 580px at 50% 116%, rgba(14,116,144,.5) 0%, transparent 60%),
    linear-gradient(162deg, #2b0f4a 0%, #1e1b4b 54%, #102b3d 100%);
  --lx-ink:#f5f0ff; --lx-ink-2:#cfc2ee; --lx-line:#3b2c62;
}
.login-card{width:100%; max-width:430px}
.login-head{text-align:center; margin-bottom:1.3rem}
.login-logo{
  width:62px; height:62px; border-radius:18px; display:grid; place-items:center;
  margin:0 auto .8rem; font-weight:900; font-size:1.25rem; letter-spacing:-.02em;
  background-color:#4c1d95;
  background-image:linear-gradient(135deg, #a21caf 0%, #7c3aed 52%, #0e7490 100%);
  color:#ffffff; box-shadow:0 16px 34px -14px rgba(124,58,237,.9);
}
.login-head h1{color:var(--lx-ink); font-size:1.65rem; letter-spacing:-.03em; font-weight:850}
.login-head .sys-sub{color:var(--lx-ink-2)}
.login-wrap .btn-primary{
  background-color:var(--pop-violet);
  background-image:linear-gradient(135deg, var(--pop-violet) 0%, var(--pop-pink) 100%);
  border-color:transparent; color:var(--pop-ink);
  border-radius:999px; box-shadow:0 12px 26px -10px rgba(124,58,237,.8);
}
.login-wrap .btn-primary:hover{
  background-color:var(--pop-violet-d);
  background-image:linear-gradient(135deg, var(--pop-violet-d) 0%, var(--pop-pink-d) 100%);
  border-color:transparent; color:var(--pop-ink);
}
/* the demo account list is read aloud during a demo, so it gets its own
   dark panel rather than inheriting the light table styling */
.login-wrap .accounts{
  background-color:#231a3e; border:1px solid var(--lx-line); border-radius:var(--radius);
  padding:.9rem 1rem; margin-top:1rem; color:var(--lx-ink-2); font-size:.82rem;
}
.login-wrap .accounts > b{color:var(--lx-ink)}
.login-wrap .accounts .mono{color:#f0abfc}
.login-wrap .accounts table.tbl th{
  background-color:#2e2352; color:var(--lx-ink-2); border-bottom-color:var(--lx-line);
}
.login-wrap .accounts table.tbl td{color:var(--lx-ink); border-bottom-color:var(--lx-line)}
.login-wrap .accounts table.tbl tbody tr:hover{background-color:#2a2049}
.login-wrap .build{color:var(--lx-ink-2)}
:root[data-theme="dark"] .login-wrap .card{background:#1c1536; border-color:#332a5a}
:root[data-theme="dark"] .login-wrap input{background:#141029; border-color:#3b2c62}

/* ---------- launcher ---------- */
/* The launcher is a fixed brand surface in both colour schemes: a deep
   aubergine to indigo field with the three systems floating on it.
   background-color carries the darkest stop so that a contrast check
   measures against something real rather than falling through to the body. */
.launchbody{
  min-height:100vh;
  background-color:#1a1033;
  background-image:
    radial-gradient(880px 560px at 6% -12%, rgba(124,58,237,.55) 0%, transparent 58%),
    radial-gradient(820px 520px at 94% -8%, rgba(190,24,93,.45) 0%, transparent 56%),
    radial-gradient(900px 620px at 58% 118%, rgba(14,116,144,.5) 0%, transparent 60%),
    linear-gradient(162deg, #2b0f4a 0%, #1e1b4b 54%, #102b3d 100%);
  --lx-ink:#f5f0ff;
  --lx-ink-2:#cfc2ee;
  --lx-line:#3b2c62;
}
.launchbody .topbar{
  background-color:#25123f;
  background-image:linear-gradient(90deg, rgba(124,58,237,.30) 0%, rgba(190,24,93,.18) 55%, rgba(14,116,144,.28) 100%);
  border-bottom:1px solid var(--lx-line);
}
.launchbody .sys-name{color:var(--lx-ink)}
.launchbody .sys-sub{color:var(--lx-ink-2)}
.launchbody .who{color:var(--lx-ink-2)}
.launchbody .who b{color:var(--lx-ink)}
.launchbody h1{font-size:2.3rem; letter-spacing:-.04em; font-weight:850; color:var(--lx-ink)}
.launchbody .lede{color:var(--lx-ink-2); font-size:1.02rem; max-width:680px}
.launchbody .chain-note{
  background-color:#231a3e; background-image:none;
  border:1px solid var(--lx-line); border-left:5px solid #c4b5fd;
  color:var(--lx-ink-2);
}
.launchbody .chain-note b{color:var(--lx-ink)}
.launchbody .chain-note .mono{color:#f0abfc}
/* the cards stay on the panel surface so they read as objects on the field */
:root[data-theme="dark"] .launchbody .app-card{background:#1c1536; border-color:#332a5a}
.apps-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:1rem; margin-top:1.2rem}
.app-card{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:1.2rem; cursor:pointer; box-shadow:var(--shadow); font:inherit; color:var(--ink-1); transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.app-card:hover{transform:translateY(-3px); box-shadow:0 18px 38px -18px rgba(37,99,235,.5); border-color:var(--primary)}
.app-chip{display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; border-radius:15px; font-weight:900; font-size:.92rem; margin-bottom:.9rem; letter-spacing:-.02em}
.app-card{position:relative; overflow:hidden}
.app-card:before{content:""; position:absolute; inset:0 0 auto 0; height:5px}
.card-shop:before{background-image:linear-gradient(90deg,#c026d3,#7c3aed)}
.card-erp:before{background-image:linear-gradient(90deg,#2563eb,#0e7490)}
.card-wms:before{background-image:linear-gradient(90deg,#059669,#0d9488)}
.card-shop:hover{border-color:#a21caf; box-shadow:0 18px 38px -18px rgba(162,28,175,.5)}
.card-erp:hover{border-color:#1f4b78; box-shadow:0 18px 38px -18px rgba(37,99,235,.5)}
.card-wms:hover{border-color:#1f6b4d; box-shadow:0 18px 38px -18px rgba(5,150,105,.5)}
.chain-note{border-left:5px solid var(--pop-violet)}
.chip-shop{background-color:#a21caf; background-image:linear-gradient(135deg,#c026d3,#7c3aed); color:#fff}
.chip-erp{background-color:#1f4b78; background-image:linear-gradient(135deg,#2563eb,#0e7490); color:#fff}
.chip-wms{background-color:#1f6b4d; background-image:linear-gradient(135deg,#059669,#0d9488); color:#fff}
.app-card h3{margin-bottom:.25rem}
.app-meta{display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.8rem}

/* ============================================================
   STOREFRONT - glossy, high colour consumer styling
   ============================================================ */
.shopbody{
  background:
    radial-gradient(880px 540px at 10% -10%, var(--hero-1) 0%, transparent 58%),
    radial-gradient(820px 500px at 90% -6%, var(--hero-2) 0%, transparent 56%),
    radial-gradient(760px 460px at 50% 16%, var(--hero-3) 0%, transparent 54%),
    var(--bg);
  min-height:100vh;
}

/* glass top bar */
.shop-top{
  position:sticky; top:0; z-index:500;
  background:var(--glass);
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--glass-line);
}
.shop-top-in{display:flex; align-items:center; gap:1rem; padding:.8rem 20px; max-width:1240px; margin:0 auto}
.shop-brand{font-weight:900; font-size:1.22rem; letter-spacing:-.03em; color:var(--ink-1); cursor:pointer; background:none; border:0; font-family:inherit; padding:0}
.shop-brand span{color:var(--pop-pink)}
.shop-nav{display:flex; gap:.15rem}
.basket-btn{position:relative}
.basket-count{
  position:absolute; top:-7px; right:-7px; min-width:20px; height:20px; padding:0 5px;
  border-radius:999px; background:var(--pop-pink); color:#fff; font-size:.7rem; font-weight:900;
  display:grid; place-items:center; box-shadow:0 2px 8px -1px rgba(219,39,119,.7);
}
:root[data-theme="dark"] .basket-count{color:var(--pop-ink)}

/* storefront buttons are louder than the back office ones */
.shopbody .btn-primary{
  background-color:var(--pop-violet); border-color:transparent; color:var(--pop-ink);
}
.shopbody .btn-primary:hover{
  background-color:var(--pop-violet-d); border-color:transparent; color:var(--pop-ink);
}
.btn-accent{
  background-color:var(--pop-violet);
  background-image:linear-gradient(135deg, var(--pop-violet) 0%, var(--pop-pink) 100%);
  border-color:transparent; color:var(--pop-ink);
  box-shadow:0 10px 24px -8px rgba(124,58,237,.65);
}
.btn-accent:hover{
  background-color:var(--pop-violet-d);
  background-image:linear-gradient(135deg, var(--pop-violet-d) 0%, var(--pop-pink-d) 100%);
  border-color:transparent; color:var(--pop-ink);
  box-shadow:0 14px 30px -8px rgba(190,24,93,.7);
  transform:translateY(-1px);
}
.btn-accent.btn-lg{border-radius:999px; letter-spacing:.01em}

/* hero */
.hero{padding:3.4rem 0 2.6rem; text-align:center; position:relative}
.hero h1{
  font-size:3.1rem; letter-spacing:-.045em; margin-bottom:.7rem; line-height:1.03; font-weight:850;
}
.hero p{font-size:1.08rem; color:var(--ink-2); max-width:600px; margin:0 auto 1.5rem}
.hero-pill{
  display:inline-flex; align-items:center; gap:.4rem; padding:.34rem .95rem; border-radius:999px;
  background-color:var(--pop-pink); color:#ffffff;
  font-size:.74rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
  margin-bottom:1.1rem; border:0; box-shadow:0 8px 20px -8px rgba(219,39,119,.8);
}
:root[data-theme="dark"] .hero-pill{color:var(--pop-ink)}

/* promise strip under the hero */
.promise{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:.6rem;
  margin:0 0 2rem; padding:0;
}
.promise div{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:.7rem .9rem; font-size:.84rem; font-weight:700; color:var(--ink-2);
  box-shadow:var(--shadow);
}
.promise b{display:block; font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; margin-bottom:.15rem}
.p1 b{color:var(--pop-violet)} .p2 b{color:var(--pop-pink)} .p3 b{color:var(--pop-cyan)} .p4 b{color:var(--pop-amber)}

/* product grid */
.prod-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(236px,1fr)); gap:1.2rem; padding-bottom:3rem}
.prod-card{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:18px;
  overflow:hidden; box-shadow:var(--shadow); cursor:pointer; text-align:left; padding:0;
  font:inherit; color:var(--ink-1);
  transition:transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s ease, border-color .16s ease;
}
.prod-card:hover{transform:translateY(-5px); box-shadow:0 20px 40px -18px rgba(124,58,237,.55); border-color:var(--pop-violet)}
.prod-art{aspect-ratio:4/3; display:block; width:100%}
.prod-body{padding:.9rem 1rem 1.05rem}
.prod-cat{font-size:.68rem; font-weight:900; letter-spacing:.11em; text-transform:uppercase; color:var(--pop-violet); margin-bottom:.35rem}
.prod-name{font-weight:750; font-size:1rem; margin-bottom:.35rem; letter-spacing:-.01em}
.prod-price{font-weight:900; font-size:1.12rem; color:var(--ink-1); letter-spacing:-.02em}
.tag{
  position:absolute; top:.7rem; left:.7rem; padding:.2rem .55rem; border-radius:999px;
  font-size:.66rem; font-weight:900; letter-spacing:.07em; text-transform:uppercase;
}
.tag-low{background:var(--pop-amber); color:#fff}
.tag-out{background:var(--ink-1); color:var(--bg)}
:root[data-theme="dark"] .tag-low{color:var(--pop-ink)}

/* product detail */
.pdp{display:grid; grid-template-columns:1fr 1fr; gap:2.6rem; padding:2rem 0 3.4rem}
@media(max-width:860px){.pdp{grid-template-columns:1fr; gap:1.6rem}}
.pdp-art{align-self:start; border-radius:22px; overflow:hidden; border:1px solid var(--line); box-shadow:0 24px 50px -24px rgba(124,58,237,.45)}
.pdp h1{font-size:2.15rem; letter-spacing:-.035em; font-weight:850}
.price-lg{font-size:1.95rem; font-weight:900; margin:.45rem 0 1rem; letter-spacing:-.03em; color:var(--pop-violet)}
.qty{display:inline-flex; align-items:stretch; border:1px solid var(--line-2); border-radius:999px; overflow:hidden; background:var(--surface)}
.qty button{width:40px; border:0; background:transparent; color:var(--pop-violet); font-size:1.15rem; font-weight:900; cursor:pointer}
.qty button:hover{background:var(--surface-3)}
.qty input{width:58px; border:0; border-left:1px solid var(--line-2); border-right:1px solid var(--line-2); text-align:center; border-radius:0; font-weight:700}
.stock-line{font-size:.88rem; font-weight:800; margin:.6rem 0}

/* basket */
.basket-line{display:grid; grid-template-columns:84px 1fr auto; gap:1rem; padding:1rem 0; border-bottom:1px solid var(--line); align-items:start}
.basket-art{border-radius:12px; overflow:hidden; border:1px solid var(--line)}
.totals{display:grid; grid-template-columns:1fr auto; gap:.45rem .8rem; font-size:.93rem}
.totals .t-lbl{color:var(--ink-2)}
.totals .t-val{text-align:right; font-variant-numeric:tabular-nums; font-weight:600}
.totals .t-grand{font-weight:900; font-size:1.25rem; border-top:2px solid var(--line-2); padding-top:.55rem; margin-top:.35rem; letter-spacing:-.02em}

/* checkout */
.checkout-grid{display:grid; grid-template-columns:1.4fr .9fr; gap:2rem; padding:1.6rem 0 3.4rem; align-items:start}
@media(max-width:940px){.checkout-grid{grid-template-columns:1fr}}
.opt-list{display:grid; gap:.6rem}
.opt{display:flex; gap:.8rem; align-items:flex-start; border:2px solid var(--line-2); border-radius:14px; padding:.8rem .95rem; cursor:pointer; background:var(--surface); transition:border-color .12s ease, background .12s ease}
.opt:hover{border-color:var(--pop-violet)}
.opt:has(input:checked){border-color:var(--pop-violet); background:var(--surface-2)}
.opt input{margin-top:.15rem; width:17px; height:17px; flex:0 0 auto; accent-color:var(--pop-violet)}
.opt-name{font-weight:800; font-size:.93rem; display:block}
.opt-desc{font-size:.81rem; color:var(--ink-3); display:block}
.opt-price{margin-left:auto; font-weight:900; font-size:.95rem; white-space:nowrap; color:var(--pop-violet)}
.shopbody .check input{accent-color:var(--pop-violet)}

/* confirmation */
.confirm-hero{text-align:center; padding:3.2rem 0 1.6rem}
.confirm-tick{
  width:68px; height:68px; border-radius:50%; display:grid; place-items:center; margin:0 auto 1.1rem;
  background-color:var(--ok); color:#ffffff; font-size:1.3rem; font-weight:900; letter-spacing:.02em;
  box-shadow:0 14px 30px -12px rgba(21,104,63,.8); border:0;
}
:root[data-theme="dark"] .confirm-tick{color:#06170e}
.ref-box{display:inline-block; padding:.85rem 1.5rem; border:2px dashed var(--pop-violet); border-radius:16px; background:var(--surface); margin:.9rem 0}
.ref-box .ref{font-family:var(--mono); font-size:1.35rem; font-weight:900; letter-spacing:.05em; color:var(--pop-violet)}

/* ============================================================
   ERP - dense enterprise styling
   ============================================================ */
.erp-shell{font-size:13px}
.erp-shell h1{font-size:1.15rem} .erp-shell h2{font-size:1rem} .erp-shell h3{font-size:.9rem}
.erp-bar{background:var(--erp); color:var(--erp-ink); padding:.3rem 20px; font-size:.76rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; display:flex; gap:1.2rem; align-items:center}
.erp-fnkeys{display:flex; gap:.3rem; flex-wrap:wrap; padding:.4rem 20px; background:var(--surface-3); border-bottom:1px solid var(--line-2)}
.fnkey{font-family:var(--mono); font-size:.74rem; font-weight:700; padding:.24rem .5rem; border:1px solid var(--line-2); border-radius:3px; background:var(--surface); color:var(--ink-2); cursor:pointer}
.fnkey:hover{background:var(--surface-2); color:var(--ink-1); border-color:var(--ink-3)}
.fnkey:disabled{opacity:.5; cursor:not-allowed}
.erp-filters{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.5rem .7rem; padding:.7rem .85rem; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-s); margin-bottom:.7rem}
.erp-filters .field{margin-bottom:0}
.erp-filters label{font-size:.72rem; text-transform:uppercase; letter-spacing:.04em}
.erp-filters input,.erp-filters select{padding:.34rem .5rem; font-size:.82rem}
table.grid{width:100%; border-collapse:collapse; font-size:.8rem; font-variant-numeric:tabular-nums}
table.grid th{background:var(--surface-3); color:var(--ink-2); text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.04em; font-weight:800; padding:.36rem .5rem; border:1px solid var(--line-2); white-space:nowrap; position:sticky; top:0}
table.grid td{padding:.3rem .5rem; border:1px solid var(--line); white-space:nowrap}
table.grid tbody tr{cursor:pointer}
table.grid tbody tr:hover{background:var(--erp-soft)}
table.grid tbody tr[aria-selected="true"]{background:var(--erp-soft); outline:2px solid var(--erp); outline-offset:-2px}
.grid-wrap{max-height:none; overflow:auto; border:1px solid var(--line-2); border-radius:3px; background:var(--surface)}
.st{display:inline-block; padding:.08rem .38rem; border-radius:3px; font-size:.68rem; font-weight:800; letter-spacing:.03em; border:1px solid}
.st-hold{background:var(--risk-soft); color:var(--risk); border-color:var(--risk)}
.st-rel{background:var(--ok-soft); color:var(--ok); border-color:var(--ok)}
.st-alloc{background:var(--info-soft); color:var(--info); border-color:var(--info)}
.st-canc{background:var(--surface-3); color:var(--ink-3); border-color:var(--line-2)}
.st-new{background:var(--warn-soft); color:var(--warn); border-color:var(--warn)}
.tabs{display:flex; gap:0; border-bottom:2px solid var(--line-2); margin-bottom:.8rem; flex-wrap:wrap}
.tab{padding:.42rem .85rem; font-size:.8rem; font-weight:700; border:1px solid var(--line-2); border-bottom:0; background:var(--surface-2); color:var(--ink-2); cursor:pointer; margin-right:2px; border-radius:4px 4px 0 0; position:relative; top:2px; font-family:inherit}
.tab:hover{background:var(--surface-3); color:var(--ink-1)}
.tab[aria-selected="true"]{background:var(--surface); color:var(--ink-1); border-bottom:2px solid var(--surface)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:.22rem .8rem; font-size:.8rem}
.kv dt{color:var(--ink-3); font-weight:700; text-transform:uppercase; font-size:.68rem; letter-spacing:.04em; padding-top:.1rem}
.kv dd{margin:0; color:var(--ink-1)}
.erp-cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1rem}

/* ============================================================
   WMS
   ============================================================ */
.wms-bar{background:var(--wms); color:var(--wms-ink); padding:.3rem 20px; font-size:.76rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; display:flex; gap:1.2rem; align-items:center}
.pick-row{display:grid; grid-template-columns:auto 1fr auto auto; gap:.8rem; align-items:center; padding:.6rem .8rem; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--surface); margin-bottom:.5rem}
.pick-row.done{background:var(--ok-soft); border-color:var(--ok)}
.pick-row.short{background:var(--warn-soft); border-color:var(--warn)}
.bin{font-family:var(--mono); font-weight:800; font-size:.86rem; background:var(--surface-3); padding:.2rem .45rem; border-radius:3px; border:1px solid var(--line-2)}
.track-timeline{position:relative; padding-left:1.6rem}
.track-ev{position:relative; padding:0 0 1.1rem}
.track-ev:before{content:""; position:absolute; left:-1.6rem; top:.35rem; width:11px; height:11px; border-radius:50%; background:var(--surface); border:2px solid var(--line-2)}
.track-ev.done:before{background:var(--ok); border-color:var(--ok)}
.track-ev:after{content:""; position:absolute; left:-1.13rem; top:1.05rem; bottom:-.15rem; width:2px; background:var(--line)}
.track-ev:last-child:after{display:none}
.track-when{font-size:.76rem; color:var(--ink-3); font-weight:700}
.track-what{font-weight:700; font-size:.88rem}

/* ---------- print-ish ---------- */
@media (max-width:760px){
  .hero h1{font-size:1.9rem}
  .topbar-in{flex-wrap:wrap; row-gap:.45rem}
  /* the storefront bar carries seven controls; without this it forces the
     whole page 180px wider than a phone viewport */
  .shop-top-in{flex-wrap:wrap; row-gap:.5rem; column-gap:.5rem}
  .shop-top-in .spacer{display:none}
  .shop-brand{flex:1 1 100%}
  .wrap, .wrap-wide{padding:0 16px}
  .checkout-grid, .pdp{gap:1.2rem}
  .basket-line{grid-template-columns:64px 1fr; row-gap:.5rem}
  .basket-line > .right{grid-column:2; text-align:left}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<script>
"use strict";
/* ============================================================
   CORE - clock, storage, helpers, auth, launcher, routing
   ============================================================ */

const BUILD = "2026.09.23";
const STORE_KEY = "halcyon.commerce.v1";

/* Fixed clock. Every date in this application is derived from it so that
   boundary values in the knowledge base stay stable between runs. */
const NOW = new Date("2026-09-22T09:00:00Z");
const nowISO = () => NOW.toISOString();

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------- formatting ---------- */
const money = n => "GBP " + Number(n || 0).toFixed(2);
const money0 = n => Number(n || 0).toLocaleString("en-GB", {minimumFractionDigits:2, maximumFractionDigits:2});
const pad = (n, w) => String(n).padStart(w, "0");

/* Dates: stored ISO, displayed dd-mm-yyyy. */
function isoToUK(iso){
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3] + "-" + m[2] + "-" + m[1]) : String(iso || "");
}
function ukToISO(v){
  const s = String(v || "").trim();
  let m = s.match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if(m) return m[3] + "-" + m[2] + "-" + m[1];
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return s;
  return null;
}
function stamp(iso){
  const d = new Date(iso);
  if(isNaN(d)) return String(iso || "");
  return isoToUK(d.toISOString().slice(0,10)) + " " + pad(d.getUTCHours(),2) + ":" + pad(d.getUTCMinutes(),2);
}
function addDays(iso, n){
  const d = new Date(iso); d.setUTCDate(d.getUTCDate() + n); return d.toISOString();
}
/* Working days skip Saturday and Sunday. */
function addWorkingDays(iso, n){
  const d = new Date(iso); let left = n;
  while(left > 0){ d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if(w !== 0 && w !== 6) left--; }
  return d.toISOString();
}
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* ---------- toast ---------- */
/* One toast at a time. Two elements carrying the same data-testid make a
   strict locator ambiguous, which is a real problem for a test tool. */
function toast(msg){
  $$("#toast .toast").forEach(t => t.remove());
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role","status");
  el.setAttribute("data-testid","toast");
  el.textContent = msg;
  $("#toast").appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ---------- state ---------- */
let state = null;

function blankState(){
  return {
    version: BUILD,
    theme: "light",
    session: null,
    basket: { lines: [], promo: "", promoCode: "" },
    checkout: null,
    orders: [],
    seq: { order: 146, delivery: 0, rma: 0 },
    errors: {}
  };
}

function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && p.version === BUILD){ state = p; return; }
    }
  }catch(e){}
  state = blankState();
  save();
}
/* Resetting clears orders, basket and checkout across all three systems.
   The signed in user and the colour scheme are kept so that a journey can
   reset at the start without having to sign in twice. */
function resetDemo(){
  const theme = state ? state.theme : "light";
  const session = state ? state.session : null;
  state = blankState();
  state.theme = theme;
  state.session = session;
  save();
}

/* ---------- users ---------- */
const USERS = [
  { id:"salesops", name:"Amara Morgan", title:"Sales Operations", role:"SalesOps",
    username:"amara.morgan", password:"Halcyon#2026", systems:["erp"], releaseLimit:5000 },
  { id:"credit", name:"Ravi Chandra", title:"Credit Control", role:"CreditControl",
    username:"ravi.chandra", password:"Halcyon#2026", systems:["erp"], releaseLimit:null },
  { id:"picker", name:"Tolu Oyelaran", title:"Warehouse Operative", role:"Warehouse",
    username:"tolu.oyelaran", password:"Halcyon#2026", systems:["wms"], releaseLimit:0 },
  { id:"super", name:"Stefan Novak", title:"Logistics Supervisor", role:"Supervisor",
    username:"stefan.novak", password:"Halcyon#2026", systems:["wms"], releaseLimit:0 },
  { id:"admin", name:"Karen Bell", title:"Platform Administrator", role:"Administrator",
    username:"karen.bell", password:"Halcyon#2026", systems:["erp","wms"], releaseLimit:null }
];
const userById = id => USERS.find(u => u.id === id) || null;
const sessionUser = () => state && state.session ? userById(state.session.userId) : null;
function hasSystem(sys){
  const u = sessionUser();
  if(!u) return false;
  if(sys === "shop") return true;
  return u.systems.indexOf(sys) >= 0;
}

/* ---------- theme ---------- */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme === "dark" ? "dark" : "light");
}
function toggleTheme(){
  state.theme = state.theme === "dark" ? "light" : "dark";
  save(); applyTheme(); render();
}

/* ---------- routing ---------- */
function routeParts(){
  const h = (location.hash || "#/apps").replace(/^#\/?/, "");
  return h.split("/").filter(Boolean);
}
function go(hash){
  if(location.hash === hash) render();
  else location.hash = hash;
}

/* ---------- login ---------- */
let loginError = "";
let loginDraft = { username:"", password:"" };

function renderLogin(){
  const app = $("#app");
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-head">
        <div class="login-logo">HR</div>
        <h1 style="margin-bottom:.15rem">Halcyon Retail Group</h1>
        <div class="sys-sub">Order to Cash Platform</div>
      </div>
      <div class="card card-pad">
        ${loginError ? `<div class="banner banner-risk" data-testid="login-error">${esc(loginError)}</div>` : ""}
        <form id="login-form" data-testid="login-form" autocomplete="off">
          <div class="field">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" data-lfield="username" value="${esc(loginDraft.username)}" data-testid="input-username" autocomplete="username">
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" data-lfield="password" value="${esc(loginDraft.password)}" data-testid="input-password" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" data-testid="btn-signin">Sign in</button>
        </form>
      </div>
      <div class="accounts" data-testid="demo-accounts">
        <b>Demo accounts</b> (password <span class="mono">Halcyon#2026</span>)
        <table class="tbl small" style="margin-top:.5rem">
          <thead><tr><th>Username</th><th>Role</th><th>Systems</th></tr></thead>
          <tbody>
            ${USERS.map(u => `<tr>
              <td class="mono">${esc(u.username)}</td>
              <td>${esc(u.title)}</td>
              <td>${u.systems.map(s => s.toUpperCase()).join(", ")}, Storefront</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
      <div class="center small build" style="margin-top:.9rem">Build ${BUILD}</div>
    </div>
  </div>`;
}

function attemptLogin(){
  const un = loginDraft.username || ($("#login-username") || {}).value || "";
  const pw = loginDraft.password || ($("#login-password") || {}).value || "";
  const u = USERS.find(x => x.username.toLowerCase() === String(un).trim().toLowerCase());
  if(!u || u.password !== pw){
    loginError = "Username or password not recognised.";
    renderLogin();
    return;
  }
  loginError = "";
  loginDraft = { username:"", password:"" };
  state.session = { userId: u.id, since: nowISO() };
  save();
  if(location.hash !== "#/apps") location.hash = "#/apps";
  render();
}

function signOut(){
  state.session = null;
  state.checkout = null;
  save();
  loginError = "";
  loginDraft = { username:"", password:"" };
  if(location.hash !== "#/apps") location.hash = "#/apps";
  renderLogin();
}

/* ---------- launcher ---------- */
function renderLauncher(){
  const u = sessionUser();
  const app = $("#app");
  const basketQty = state.basket.lines.reduce((a, l) => a + l.qty, 0);
  const open = state.orders.filter(o => o.erp.status === "Hold").length;
  const toPick = state.orders.reduce((a, o) => a + o.deliveries.filter(d => d.status === "Allocated").length, 0);

  app.innerHTML = `
  <div class="launchbody">
  <div class="topbar"><div class="topbar-in">
    <div class="brandmark">
      <div class="brand-dot" style="background-color:#4c1d95; background-image:linear-gradient(135deg,#7c3aed,#0e7490)">HR</div>
      <div><div class="sys-name">Halcyon Retail Group</div><div class="sys-sub">Order to Cash Platform</div></div>
    </div>
    <div class="spacer"></div>
    <div class="who"><b>${esc(u.name)}</b>${esc(u.title)}</div>
    <button class="btn btn-sm" data-act="theme" data-testid="btn-theme">${state.theme === "dark" ? "Light mode" : "Dark mode"}</button>
    <button class="btn btn-sm" data-act="reset" data-testid="btn-reset">Reset demo data</button>
    <button class="btn btn-sm" data-act="signout" data-testid="btn-signout">Sign out</button>
  </div></div>

  <div class="wrap" style="padding-top:1.6rem; padding-bottom:3rem">
    <h1>Applications</h1>
    <p class="lede">One order, three systems. Place an order in the storefront, release it in the ERP, ship it from the warehouse.</p>

    <div class="apps-grid">
      <button class="app-card card-shop" data-act="open-app" data-app="shop" data-testid="app-shop">
        <div class="app-chip chip-shop">L&amp;C</div>
        <h3>Lumen and Co. Storefront</h3>
        <div class="muted small">Direct to consumer store. Browse, basket, checkout and pay.</div>
        <div class="app-meta">
          <span class="badge badge-neutral">Customer facing</span>
          ${basketQty ? `<span class="badge badge-info" data-testid="chip-basket">${basketQty} in basket</span>` : ""}
        </div>
      </button>

      <button class="app-card card-erp" data-act="open-app" data-app="erp" data-testid="app-erp">
        <div class="app-chip chip-erp">AX</div>
        <h3>Axion ERP</h3>
        <div class="muted small">Sales orders, holds and releases, allocation to fulfilment.</div>
        <div class="app-meta">
          <span class="badge badge-neutral">${hasSystem("erp") ? "Access granted" : "No access for this role"}</span>
          ${open ? `<span class="badge badge-risk" data-testid="chip-holds">${open} on hold</span>` : ""}
        </div>
      </button>

      <button class="app-card card-wms" data-act="open-app" data-app="wms" data-testid="app-wms">
        <div class="app-chip chip-wms">VW</div>
        <h3>Vector WMS</h3>
        <div class="muted small">Pick, pack, despatch, carrier allocation and tracking.</div>
        <div class="app-meta">
          <span class="badge badge-neutral">${hasSystem("wms") ? "Access granted" : "No access for this role"}</span>

function luhnOk(num){
  const s = String(num || "").replace(/\D/g, "");
  if(s.length < 12 || s.length > 19) return false;
  let sum = 0, alt = false;
  for(let i = s.length - 1; i >= 0; i--){
    let d = Number(s[i]);
    if(alt){ d *= 2; if(d > 9) d -= 9; }
    sum += d; alt = !alt;
  }
  return sum % 10 === 0;
}

/* ---------- basket maths ---------- */
function basketLines(){
  return state.basket.lines.map(l => {
    const p = productBySku(l.sku);
    const v = variantOf(p, l.vid);
    const lineNet = +(p.price * l.qty).toFixed(2);
    return { sku:l.sku, vid:l.vid, qty:l.qty, product:p, variant:v,
             unit:p.price, lineNet, weight:+(p.weight * l.qty).toFixed(2) };
  });
}
function basketCount(){ return state.basket.lines.reduce((a, l) => a + l.qty, 0); }

function appliedPromo(){
  const c = state.basket.promoCode;
  return c ? promoByCode(c) : null;
}

function basketTotals(deliveryId){
  const lines = basketLines();
  const net = +lines.reduce((a, l) => a + l.lineNet, 0).toFixed(2);
  const weight = +lines.reduce((a, l) => a + l.weight, 0).toFixed(2);
  const bulky = lines.some(l => l.product.bulky);
  const restricted = lines.some(l => l.product.restricted);

  const promo = appliedPromo();
  let discount = 0, freeship = false;
  if(promo && net >= promo.minSpend){
    if(promo.kind === "percent") discount = +(net * promo.value / 100).toFixed(2);
    else if(promo.kind === "amount") discount = Math.min(promo.value, net);
    else if(promo.kind === "freeship") freeship = true;
  }

  const opt = deliveryById(deliveryId);
  let delivery = 0;
  if(opt){
    delivery = opt.price;
    if(opt.freeOver !== null && opt.freeOver !== undefined && (net - discount) >= opt.freeOver) delivery = 0;
    if(freeship && opt.id === "standard") delivery = 0;
  }
  const taxable = +(net - discount + delivery).toFixed(2);
  const vat = +(taxable * VAT_RATE / (1 + VAT_RATE)).toFixed(2);
  const gross = taxable;
  return { lines, net, discount, delivery, vat, gross, weight, bulky, restricted, promo, freeship };
}

function availableDelivery(country, bulky){
  const z = zoneOf(country);
  return DELIVERY.filter(d => d.zones.indexOf(z) >= 0 && (d.bulkyOk || !bulky));

/* ---------- product detail ---------- */
let pdpSel = {};   /* axis -> value */
let pdpQty = 1;

function pdpVariant(p){
  if(!p.axes.length) return p.variants[0];
  return p.variants.find(v => p.axes.every(a => v[a] === pdpSel[a])) || null;
}

function viewProduct(sku){
  const p = productBySku(sku);
  if(!p){ go("#/shop"); return; }

  /* default the axis selections to the first variant that has stock */
  if(p.axes.length && !p.axes.every(a => pdpSel[a])){
    const first = p.variants.find(v => v.stock > 0) || p.variants[0];
    pdpSel = {};
    p.axes.forEach(a => pdpSel[a] = first[a]);
  }
  const v = pdpVariant(p);
  const stock = v ? v.stock : 0;
  const err = shopErrors.pdp;

  $("#app").innerHTML = `
  <div class="shopbody">
    ${shopTop("shop")}
    <div class="wrap">
      <div style="padding-top:1rem">

              <label for="pdp-${esc(axis)}">${esc(axis)}</label>
              <select id="pdp-${esc(axis)}" data-act="pdp-axis" data-axis="${esc(axis)}" data-testid="select-${esc(axis.toLowerCase())}">
                ${vals.map(val => `<option value="${esc(val)}"${pdpSel[axis] === val ? " selected" : ""}>${esc(val)}</option>`).join("")}

          <div class="stock-line" data-testid="pdp-stock">

}

function addToBasket(sku){
  const p = productBySku(sku);
  const v = pdpVariant(p);
  const qty = Math.max(1, Number(pdpQty) || 1);
  shopErrors.pdp = null;

  if(!v){ shopErrors.pdp = { code:"EC-V02", text:"That combination is not available." }; render(); return; }
  const existing = state.basket.lines.find(l => l.sku === sku && l.vid === v.id);
  const want = (existing ? existing.qty : 0) + qty;

  if(want > 10){
    shopErrors.pdp = { code:"EC-V03", text:"A maximum of 10 units of one item may be bought in a single order." };
    render(); return;
  }
  if(want > v.stock){
    shopErrors.pdp = { code:"EC-V02", text:"Only " + v.stock + " of that option are available." };
    render(); return;
  }
  if(existing) existing.qty = want;
  else state.basket.lines.push({ sku:sku, vid:v.id, qty:qty });
  save();
  toast(p.name + " added to your basket.");
  pdpQty = 1;
  go("#/shop/basket");
}

function applyPromo(){
  const raw = state.basket.promo;
  const t0 = basketTotals(null);
  const p = promoByCode(raw);
  if(!p){
    shopBanner = { kind:"risk", code:"EC-P01", text:"That promotion code is not recognised." };
    state.basket.promoCode = ""; save(); render(); return;
  }
  if(p.validTo < nowISO().slice(0,10)){
    shopBanner = { kind:"risk", code:"EC-P02", text:"That promotion ended on " + isoToUK(p.validTo) + "." };
    state.basket.promoCode = ""; save(); render(); return;
  }
  if(t0.net < p.minSpend){
    shopBanner = { kind:"warn", code:"EC-P03", text:"Spend " + money(p.minSpend) + " to use this code. Your basket is " + money(t0.net) + "." };
    state.basket.promoCode = ""; save(); render(); return;
  }
  state.basket.promoCode = p.code;
  shopBanner = { kind:"ok", code:"EC-P04", text:p.label + " applied." };
  save(); render();
}

/* ---------- checkout validation ---------- */
function validateCheckoutStep(step){
  const c = state.checkout;
  const t = basketTotals(c.deliveryOption);
  shopErrors = {};

  if(step === 1){
    if(!c.email.trim()) shopErrors.email = "Enter your email address.";
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) shopErrors.email = "Enter a valid email address.";
    if(!c.phone.trim()) shopErrors.phone = "Enter a telephone number.";
    if(!c.firstName.trim()) shopErrors.firstName = "Enter your first name.";
    if(!c.lastName.trim()) shopErrors.lastName = "Enter your last name.";
    if(!c.line1.trim()) shopErrors.line1 = "Enter the first line of the address.";
    if(!c.city.trim()) shopErrors.city = "Enter a town or city.";
    if(!c.postcode.trim()) shopErrors.postcode = "Enter a postcode.";
  }

  if(step === 2){
    const opts = availableDelivery(c.country, t.bulky);
    if(!c.deliveryOption) shopErrors.deliveryOption = "Choose a delivery method.";
    else if(!opts.some(o => o.id === c.deliveryOption)){
      shopBanner = { kind:"risk", code:"EC-D01", text:"That delivery method is not available for " + (countryByCode(c.country) || {}).name + "." };
      shopErrors.deliveryOption = "Choose a delivery method.";
    }
    if(c.deliveryOption === "collect" && !c.storeId) shopErrors.storeId = "Choose a collection store.";
  }

  if(step === 3){
    if(!c.cardName.trim()) shopErrors.cardName = "Enter the name on the card.";
    if(!c.cardNumber.trim()) shopErrors.cardNumber = "Enter the card number.";
    if(!c.expMonth) shopErrors.expMonth = "Choose a month.";
    if(!c.expYear) shopErrors.expYear = "Choose a year.";
    if(!/^\d{3,4}$/.test(String(c.cvc).trim())) shopErrors.cvc = "Enter the 3 or 4 digit security code.";
    if(!c.billingSame){
      if(!c.bLine1.trim()) shopErrors.bLine1 = "Enter the first line of the billing address.";
      if(!c.bCity.trim()) shopErrors.bCity = "Enter a town or city.";
      if(!c.bPostcode.trim()) shopErrors.bPostcode = "Enter a postcode.";
    }
    if(!c.terms) shopErrors.terms = "You must accept the terms of sale.";
    if(c.verifyRequired && !String(c.verifyCode).trim()) shopErrors.verifyCode = "Enter the one time code.";
  }
  return Object.keys(shopErrors).length === 0;
}

/* ---------- payment authorisation ---------- */
function authorise(){
  const c = state.checkout;
  const num = String(c.cardNumber).replace(/\s|-/g, "");

  if(!luhnOk(num)) return { ok:false, code:"EC-C01", text:"That card number is not valid." };

  const expIso = c.expYear + "-" + c.expMonth + "-01";
  const endOfMonth = new Date(Date.UTC(Number(c.expYear), Number(c.expMonth), 0));
  if(endOfMonth < NOW) return { ok:false, code:"EC-C02", text:"That card expired in " + c.expMonth + "-" + c.expYear + "." };

  const behaviour = TEST_CARDS[num] || "approve";
  if(behaviour === "decline") return { ok:false, code:"EC-C03", text:"The payment was declined by the card issuer." };

  if(behaviour === "verify" && !c.verifyRequired){
    return { ok:false, code:"EC-C04", text:"Your bank has asked for additional verification.", stepUp:true };
  }
  if(behaviour === "verify" && c.verifyRequired && String(c.verifyCode).trim() !== VERIFY_CODE){
    return { ok:false, code:"EC-C05", text:"That verification code is not correct." };
  }
  return { ok:true, code:"EC-A01", last4:num.slice(-4),
           authCode:"A" + pad((num.split("").reduce((a, ch) => a + Number(ch), 0) * 7) % 100000, 5) };
}

/* ---------- place order ---------- */
function placeOrder(){
  const c = state.checkout;
  shopBanner = null;
  if(!validateCheckoutStep(3)){ render(); return; }

  const auth = authorise();
  if(!auth.ok){
    if(auth.stepUp){
      c.verifyRequired = true;
      shopBanner = { kind:"warn", code:auth.code, text:auth.text };
    }else{
      shopBanner = { kind:"risk", code:auth.code, text:auth.text };
    }
    save(); render(); return;
  }

  const t = basketTotals(c.deliveryOption);
  state.seq.order += 1;
  const ref = "ORD-2026-" + pad(state.seq.order, 5);
  const cust = customerByEmail(c.email);
  const opt = deliveryById(c.deliveryOption);

  const order = {
    ref: ref,
    placedAt: nowISO(),
    channel: "Web",
    customer: {
      id: cust ? cust.id : null,
      name: (c.firstName + " " + c.lastName).trim(),

    },

    billing: c.billingSame

      : { same:false, line1:c.bLine1.trim(), city:c.bCity.trim(), postcode:c.bPostcode.trim().toUpperCase(), country:c.bCountry },
    lines: t.lines.map((l, i) => ({
      no: i + 1, sku:l.sku, vid:l.vid, name:l.product.name,

    })),

    promo: t.promo ? t.promo.code : "",
    payment: { last4:auth.last4, authCode:auth.authCode, status:"Authorised", takenAt:nowISO(), stepUp:!!c.verifyRequired },
    erp: null,

  runErpIntake(order);

/* ============================================================
   AXION ERP
   Sales order grid, order detail, hold engine, release and
   allocation. Decision codes ER-*.
   ============================================================ */

let erpFilters = { q:"", status:"All", hold:"All", country:"All", from:"", to:"", fromRaw:"", toRaw:"" };
let erpTab = "header";
let erpForm = { cancelReason:"", partial:false };
let erpBanner = null;

const norm = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");

/* ---------- fraud scoring ---------- */
function fraudScore(order){
  let s = 0; const parts = [];
  if(order.billing.country !== order.delivery.country){ s += 40; parts.push("Billing country differs from delivery country, 40"); }
  if(order.totals.gross > 1000){ s += 25; parts.push("Order value above 1,000.00, 25"); }
  if(order.delivery.option === "express" && order.customer.isNew){ s += 20; parts.push("Express delivery on a first order, 20"); }
  const dom = String(order.customer.email).split("@")[1] || "";
  if(WATCHLIST_DOMAINS.indexOf(dom.toLowerCase()) >= 0){ s += 15; parts.push("Email domain on the watchlist, 15"); }
  if(order.lines.length > 5){ s += 10; parts.push("More than five order lines, 10"); }
  return { score: Math.min(100, s), parts: parts };
}

/* ---------- hold engine, strict precedence ---------- */
function assessOrder(order){
  const f = fraudScore(order);
  const shortLines = order.lines.filter(l => l.alloc < l.qty);
  const addrOfRecord = order.customer.addrOfRecord;
  const addrDiffers = !!addrOfRecord &&
    (norm(addrOfRecord.postcode) !== norm(order.delivery.postcode) || norm(addrOfRecord.line1) !== norm(order.delivery.line1));
  const restrictedLines = order.lines.filter(l => l.restricted);
  const zone = zoneOf(order.delivery.country);

  /* 1 */
  if(restrictedLines.length && zone === "ROW")
    return { code:"ER-H01", status:"Hold", holdName:"Export control",
      reason:"Line " + restrictedLines[0].no + " contains a lithium ion battery and the destination is outside the United Kingdom and the European Union.",
      fraud:f, shortLines:shortLines, addrDiffers:addrDiffers };
  /* 2 */
  if(f.score >= 70)
    return { code:"ER-H02", status:"Hold", holdName:"Fraud review",
      reason:"The fraud score is " + f.score + ", at or above the review threshold of 70.",
      fraud:f, shortLines:shortLines, addrDiffers:addrDiffers };
  /* 3 */
  if(!order.customer.isNew && order.totals.gross > order.customer.creditLimit)
    return { code:"ER-H03", status:"Hold", holdName:"Credit limit",
      reason:"The order value of " + money(order.totals.gross) + " is above the account credit limit of " + money(order.customer.creditLimit) + ".",
      fraud:f, shortLines:shortLines, addrDiffers:addrDiffers };
  /* 4 */
  if(addrDiffers)
    return { code:"ER-H04", status:"Hold", holdName:"Address verification",
      reason:"The delivery address does not match the address of record for account " + order.customer.id + ".",
      fraud:f, shortLines:shortLines, addrDiffers:addrDiffers };
  /* 5 */
  if(shortLines.length)
    return { code:"ER-H05", status:"Hold", holdName:"Stock shortage",
      reason:"Line " + shortLines[0].no + " requires " + shortLines[0].qty + " units and " + shortLines[0].alloc + " are allocatable.",
      fraud:f, shortLines:shortLines, addrDiffers:addrDiffers };
  /* 6 */
  if(order.customer.isNew && order.totals.gross > 500)
    return { code:"ER-H06", status:"Hold", holdName:"New account review",
      reason:"This is a first order for this email address and the value of " + money(order.totals.gross) + " is above the new account threshold of 500.00.",
      fraud:f, shortLines:shortLines, addrDiffers:addrDiffers };
  /* 7 */
  return { code:"ER-P01", status:"Released", holdName:"",
    reason:"No hold condition applies. Released for fulfilment automatically.",
    fraud:f, shortLines:shortLines, addrDiffers:addrDiffers };
}

function runErpIntake(order){
  const a = assessOrder(order);
  order.erp = {
    status: a.status,
    holdCode: a.status === "Hold" ? a.code : "",
    holdName: a.holdName,
    reason: a.reason,
    decisionCode: a.code,
    fraudScore: a.fraud.score,
    fraudParts: a.fraud.parts,
    addrDiffers: a.addrDiffers,
    shortLineNos: a.shortLines.map(l => l.no),
    releasedBy: a.status === "Released" ? "System" : "",
    releasedAt: a.status === "Released" ? nowISO() : "",
    allocatedAt: "",
    cancelReason: ""
  };
  order.audit.push({ at:nowISO(), who:"Axion ERP", what:a.status === "Hold" ? ("Held: " + a.holdName) : "Released automatically", code:a.code });
  if(a.status === "Released") allocateOrder(order, false);
}

/* ---------- allocation creates a delivery note ---------- */
function allocateOrder(order, partial){
  const take = order.lines
    .map(l => ({ l:l, qty: partial ? Math.min(l.qty, l.alloc) : l.qty }))
    .filter(x => x.qty > 0);
  if(!take.length) return null;

  state.seq.delivery += 1;
  const num = order.ref.split("-")[2];
  const dnRef = "DN-" + num + "-" + (order.deliveries.length + 1);

  const d = {
    dn: dnRef,
    createdAt: nowISO(),
    status: "Allocated",
    lines: take.map((x, i) => ({
      no:i + 1, sku:x.l.sku, vid:x.l.vid, name:x.l.name, variant:x.l.variant,
      qty:x.qty, ordered:x.l.qty, bin:binFor(x.l.sku, x.l.vid),
      picked:null, short:false, damaged:false, weight:x.l.weight
    })),
    parcels: 0, carrierId:"", carrierName:"", tracking:"",
    events: [{ at:nowISO(), code:"", what:"Allocated to the warehouse" }]
  };
  order.deliveries.push(d);
  order.erp.allocatedAt = nowISO();
  order.erp.status = partial ? "Part allocated" : "Allocated";
  const back = order.lines.filter(l => l.alloc < l.qty);
  if(partial && back.length){
    order.erp.backOrder = back.map(l => ({ no:l.no, sku:l.sku, qty:l.qty - Math.max(0, l.alloc) }));
  }
  order.audit.push({ at:nowISO(), who:"Axion ERP", what:"Delivery note " + dnRef + " created", code: partial ? "ER-R02" : "ER-P01" });
  return d;
}

/* ---------- grid ---------- */
function erpRows(){
  let rows = state.orders.slice();
  const q = erpFilters.q.trim().toUpperCase();
  if(q) rows = rows.filter(o =>
    o.ref.toUpperCase().indexOf(q) >= 0 ||
    o.customer.name.toUpperCase().indexOf(q) >= 0 ||
    o.customer.email.toUpperCase().indexOf(q) >= 0 ||
    (o.customer.id || "").toUpperCase().indexOf(q) >= 0);
  if(erpFilters.status !== "All") rows = rows.filter(o => o.erp.status === erpFilters.status);
  if(erpFilters.hold !== "All") rows = rows.filter(o => (o.erp.holdCode || "None") === erpFilters.hold);
  if(erpFilters.country !== "All") rows = rows.filter(o => o.delivery.country === erpFilters.country);
  if(erpFilters.from) rows = rows.filter(o => o.placedAt.slice(0,10) >= erpFilters.from);
  if(erpFilters.to) rows = rows.filter(o => o.placedAt.slice(0,10) <= erpFilters.to);
  return rows;
}

/* ---------- release and cancel ---------- */
function erpRelease(ref){
  const o = state.orders.find(x => x.ref === ref);
  const u = sessionUser();
  if(!o || o.erp.status !== "Hold") return;

  if(u.releaseLimit !== null && o.totals.gross > u.releaseLimit){
    erpBanner = { kind:"risk", code:"ER-R04",
      text:"Release refused. " + money(o.totals.gross) + " is above your release limit of " + money(u.releaseLimit) + "." };
    o.audit.push({ at:nowISO(), who:u.name, what:"Release refused, above role limit", code:"ER-R04" });
    save(); render(); return;
  }

  const partial = !!erpForm.partial && o.erp.shortLineNos.length > 0;
  o.erp.status = "Released";
  o.erp.holdCode = "";
  o.erp.releasedBy = u.name;
  o.erp.releasedAt = nowISO();
  o.erp.decisionCode = partial ? "ER-R02" : "ER-R01";
  o.erp.reason = partial
    ? "Released with partial allocation by " + u.name + ". Lines without stock are back ordered."
    : "Released by " + u.name + " after review of " + (o.erp.holdName || "the hold") + ".";
  o.audit.push({ at:nowISO(), who:u.name, what: partial ? "Released with partial allocation" : "Released for fulfilment", code:o.erp.decisionCode });

  allocateOrder(o, partial);
  erpForm = { cancelReason:"", partial:false };
  erpBanner = { kind:"ok", code:o.erp.decisionCode, text:"Order " + o.ref + " released. Delivery note " + o.deliveries[o.deliveries.length - 1].dn + " created." };
  save(); render();
}

function erpCancel(ref){
  const o = state.orders.find(x => x.ref === ref);
  const u = sessionUser();
  if(!o) return;
  const reason = String(erpForm.cancelReason || "").trim();
  if(reason.length < 20){
    erpBanner = { kind:"risk", code:"ER-R03", text:"A cancellation reason of at least 20 characters is required. You entered " + reason.length + "." };
    save(); render(); return;
  }
  o.erp.status = "Cancelled";
  o.erp.holdCode = "";
  o.erp.decisionCode = "ER-R03";
  o.erp.cancelReason = reason;
  o.erp.reason = "Cancelled by " + u.name + ".";
  o.audit.push({ at:nowISO(), who:u.name, what:"Order cancelled. " + reason, code:"ER-R03" });
  erpForm = { cancelReason:"", partial:false };
  erpBanner = { kind:"warn", code:"ER-R03", text:"Order " + o.ref + " cancelled." };
  save(); render();
}
/* ============================================================
   VECTOR WMS
   Work queue, pick, pack, despatch, carrier allocation, tracking.
   Decision codes LG-*.
   ============================================================ */

let wmsForm = { picks:{}, damageLine:"", damageNote:"", trackQuery:"", failReason:"" };
let wmsBanner = null;

const WMS_LINKS = [
  { id:"work", label:"Work queue", href:"#/wms/work" },
  { id:"track", label:"Tracking", href:"#/wms/track" },
  { id:"returns", label:"Returns", href:"#/wms/returns" }
];

function allDeliveries(){
  const out = [];
  state.orders.forEach(o => o.deliveries.forEach(d => out.push({ o:o, d:d })));
  return out;
}
function findDelivery(dn){
  return allDeliveries().find(x => x.d.dn === dn) || null;
}
function isSupervisor(){
  const u = sessionUser();
  return u && (u.role === "Supervisor" || u.role === "Administrator");
}

function carrierFor(order){
  const opt = order.delivery.option;
  const z = zoneOf(order.delivery.country);
  if(opt === "collect") return carrierById("STC");
  if(z !== "UK") return carrierById("GLK");
  if(opt === "express") return carrierById("NLX");
  return carrierById("BRK");
}
function trackingFor(carrier, dn){
  const n = dn.split("").reduce((a, c) => a + c.charCodeAt(0), 0);
  return carrier.id + pad((n * 8081) % 1000000000, 9);
}
function parcelsFor(d){
  const w = d.lines.reduce((a, l) => a + l.weight * (l.picked === null ? l.qty : l.picked), 0);
  return Math.max(1, Math.ceil(w / 15));
}

function wmsConfirmPick(dn){
  const x = findDelivery(dn);
  if(!x) return;
  const { o, d } = x;
  if(d.status !== "Allocated") return;          /* already picked */
  let short = false, any = false;
  d.lines.forEach(l => {
    const raw = wmsForm.picks[l.no];
    const v = raw === undefined ? l.qty : Math.max(0, Math.min(l.qty, Number(raw) || 0));
    l.picked = v;
    if(v < l.qty) short = true;
    if(v > 0) any = true;
  });
  if(!any){
    wmsBanner = { kind:"risk", code:"LG-P02", text:"Nothing was picked. Record at least one unit or cancel the pick." };
    save(); render(); return;
  }
  d.status = "Picked";
  const code = short ? "LG-P02" : "LG-P01";
  dEvent(d, code, short ? "Short pick recorded, remainder back ordered" : "Pick confirmed in full");
  o.audit.push({ at:nowISO(), who:sessionUser().name, what:"Pick " + (short ? "short" : "complete") + " on " + d.dn, code:code });
  if(short){
    o.erp.backOrder = (o.erp.backOrder || []).concat(
      d.lines.filter(l => l.picked < l.qty).map(l => ({ no:l.no, sku:l.sku, qty:l.qty - l.picked })));
  }
  wmsForm.picks = {};
  wmsBanner = { kind: short ? "warn" : "ok", code:code,
    text: short ? "Short pick recorded on " + d.dn + ". The remainder is back ordered." : "Pick confirmed on " + d.dn + "." };
  save(); go("#/wms/pack/" + dn);
}

function wmsDamage(dn){
  const x = findDelivery(dn);
  if(!x) return;
  const { o, d } = x;
  if(d.status !== "Picked") return;
  const no = Number(wmsForm.damageLine);
  const note = String(wmsForm.damageNote || "").trim();
  if(!no){
    wmsBanner = { kind:"risk", code:"LG-K03", text:"Choose the line that is damaged." };
    save(); render(); return;
  }
  if(note.length < 15){
    wmsBanner = { kind:"risk", code:"LG-K03", text:"A damage note of at least 15 characters is required. You entered " + note.length + "." };
    save(); render(); return;
  }
  const line = d.lines.find(l => l.no === no);
  if(!line) return;
  line.damaged = true;
  dEvent(d, "LG-K03", "Line " + no + " withdrawn as damaged. " + note);
  o.audit.push({ at:nowISO(), who:sessionUser().name, what:"Damage recorded on " + d.dn + " line " + no + ". " + note, code:"LG-K03" });
  wmsForm.damageLine = ""; wmsForm.damageNote = "";
  wmsBanner = { kind:"warn", code:"LG-K03", text:"Line " + no + " withdrawn as damaged." };
  save(); render();
}

function wmsPack(dn){
  const x = findDelivery(dn);
  if(!x) return;
  const { o, d } = x;
  if(d.status !== "Picked") return;              /* already packed */

  const code = d.parcels > 1 ? "LG-K02" : "LG-K01";
  dEvent(d, code, "Packed into " + d.parcels + " parcel" + (d.parcels === 1 ? "" : "s"));

function wmsFailed(dn){

  if(x.d.status !== "Despatched") return;

    wmsBanner = { kind:"risk", code:"LG-D02", text:"Only a supervisor may record a failed attempt." };

  const reason = wmsForm.failReason;

function wmsReturn(dn){
  const x = findDelivery(dn);
  if(!x) return;
  const { o, d } = x;
  if(d.status !== "Delivered") return;
  state.seq.rma += 1;
  const rma = "RMA-" + pad(state.seq.rma, 4);
  d.rma = rma;
  d.status = "Return requested";
  dEvent(d, "LG-R01", "Return requested, reference " + rma);
  o.audit.push({ at:nowISO(), who:sessionUser().name, what:"Return " + rma + " raised on " + d.dn, code:"LG-R01" });
  wmsBanner = { kind:"info", code:"LG-R01", text:"Return " + rma + " raised." };
  save(); go("#/wms/returns");
}

function viewWmsReturns(){
  const rows = allDeliveries().filter(x => x.d.rma);
  $("#app").innerHTML = `
  <div class="erp-shell">
    ${backOfficeTop("wms", WMS_LINKS, "returns")}
    <div class="wrap-wide" style="padding-top:.9rem; padding-bottom:2.5rem">
      <h1>Returns</h1>
      ${wmsBanner ? `<div class="banner banner-${wmsBanner.kind}" data-testid="wms-banner"><b>${esc(wmsBanner.code)}</b> ${esc(wmsBanner.text)}</div>` : ""}
      <div class="grid-wrap">
        <table class="grid" data-testid="grid-returns">
          <thead><tr><th>Return</th><th>Delivery note</th><th>Order</th><th>Customer</th><th>Status</th><th>Action</th></tr></thead>
          <tbody>
            ${!rows.length ? `<tr><td colspan="6" class="center muted" data-testid="returns-empty">No returns have been raised.</td></tr>` : ""}
            ${rows.map(x => `<tr data-testid="rma-${esc(x.d.rma)}">
              <td class="mono"><b>${esc(x.d.rma)}</b></td>
              <td class="mono">${esc(x.d.dn)}</td>
              <td class="mono">${esc(x.o.ref)}</td>
              <td>${esc(x.o.customer.name)}</td>
              <td>${esc(x.d.status)}</td>
              <td>${x.d.status === "Return requested"
                ? `<button class="btn btn-sm btn-ok" data-act="wms-return-received" data-dn="${esc(x.d.dn)}" data-testid="btn-receive-${esc(x.d.rma)}">Record as received</button>`
                : '<span class="muted small">Closed</span>'}</td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function wmsReturnReceived(dn){
  const x = findDelivery(dn);
  if(!x) return;
  const { o, d } = x;
  if(d.status !== "Return requested") return;
  d.status = "Return received";
  dEvent(d, "LG-R02", "Return " + d.rma + " received into the warehouse");
  o.audit.push({ at:nowISO(), who:sessionUser().name, what:"Return " + d.rma + " received", code:"LG-R02" });
  wmsBanner = { kind:"ok", code:"LG-R02", text:"Return " + d.rma + " received." };
  save(); render();
}

/* ---------- tracking ---------- */
function viewWmsTrack(){

  let hit = null;
  if(q) hit = allDeliveries().find(x =>
    (x.d.tracking || "").toUpperCase() === q ||
    (x.d.dn || "").toUpperCase() === q ||
    (x.o.ref || "").toUpperCase() === q) || null;

  $("#app").innerHTML = `
  <div class="erp-shell">
    ${backOfficeTop("wms", WMS_LINKS, "track")}
    <div class="wrap" style="padding-top:.9rem; padding-bottom:2.5rem">
      <h1>Track a consignment</h1>
      <p class="muted small">Search by tracking number, delivery note or order reference.</p>
      <div class="row" style="flex-wrap:nowrap; max-width:560px">
        <input type="search" id="track-q" value="${esc(wmsForm.trackQuery)}" data-wfield="trackQuery" data-testid="input-track" placeholder="NLX123456789, DN-00147-1 or ORD-2026-00147">
        <button class="btn btn-primary" data-act="wms-track" data-testid="btn-track">Track</button>
      </div>

      ${!q ? "" : !hit ? `
        <div class="banner banner-warn" style="margin-top:1rem" data-testid="track-none"><b>Not found</b> No consignment matches that reference.</div>` : `
        <div class="card card-pad" style="margin-top:1rem" data-testid="track-result">
          <div class="row">
            <h3 style="margin:0">${esc(hit.d.dn)}</h3>
            <span class="badge badge-neutral" data-testid="track-status">${esc(hit.d.status)}</span>
            <div class="spacer"></div>
            <button class="btn btn-sm" data-act="nav" data-href="#/wms/delivery/${esc(hit.d.dn)}" data-testid="btn-open-delivery">Open</button>
          </div>
          <dl class="kv" style="margin-top:.7rem">
            <dt>Order</dt><dd class="mono">${esc(hit.o.ref)}</dd>
            <dt>Carrier</dt><dd>${esc(hit.d.carrierName || "Not allocated")}</dd>
            <dt>Tracking</dt><dd class="mono">${esc(hit.d.tracking || "Not issued")}</dd>
            <dt>Deliver to</dt><dd>${esc(hit.o.delivery.city)}, ${esc(hit.o.delivery.postcode)}</dd>
          </dl>
          <hr class="divider">
          <div class="track-timeline">
            ${hit.d.events.map(ev => `<div class="track-ev done">
              <div class="track-when">${stamp(ev.at)} ${esc(ev.code || "")}</div>
              <div class="track-what">${esc(ev.what)}</div>
            </div>`).join("")}
          </div>
        </div>`}
    </div>
  </div>`;
