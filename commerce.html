/* ============================================================
   EVENT HANDLING, ROUTER, BOOT
   Every field is written on BOTH the input and the change event.
   A WebDriver select by visible text fires change only; typing in a
   text box fires input only. Listening to one of them is the single
   commonest cause of a value that appears on screen and is then lost
   on the next re-render.
   ============================================================ */

/* Fields that change what is on the page and therefore need a re-render. */
const LIVE = {
  cfield: ["country", "deliveryOption", "billingSame", "verifyRequired"],
  efield: ["status", "hold", "country", "partial"],
  wfield: ["damageLine", "failReason"]
};

/* Fields that update one region only, so that typing is never interrupted. */
const PARTIAL = {
  efield: {
    q: refreshErpGrid, from: refreshErpGrid, to: refreshErpGrid,
    cancelReason: refreshReasonCount
  },
  wfield: {
    pick: refreshPickRow
  }
};

function refreshErpGrid(){
  if(!$("[data-testid=grid-orders]")) return;
  const rows = erpRows();
  const body = $("[data-testid=grid-orders] tbody");
  if(body) body.innerHTML = rows.length
    ? rows.map(o => `<tr data-act="open-order" data-ref="${esc(o.ref)}" data-testid="row-${esc(o.ref)}">
        <td class="mono"><b>${esc(o.ref)}</b></td>
        <td>${isoToUK(o.placedAt.slice(0,10))}</td>
        <td>${esc(o.customer.name)}</td>
        <td class="mono">${esc(o.customer.id || "new")}</td>
        <td>${esc(o.delivery.country)}</td>
        <td class="right">${o.lines.length}</td>
        <td class="right">${money0(o.totals.net)}</td>
        <td class="right">${money0(o.totals.gross)}</td>
        <td><span class="st ${ST_CLASS[o.erp.status] || "st-new"}">${esc(o.erp.status)}</span></td>
        <td class="mono">${esc(o.erp.holdCode || "")}</td>
        <td class="right">${o.erp.fraudScore}</td>
        <td class="mono">${esc(o.deliveries.map(d => d.dn).join(" "))}</td>
      </tr>`).join("")
    : `<tr><td colspan="12" class="center muted" data-testid="grid-empty">No orders match the filters. Place an order in the storefront first.</td></tr>`;
  const c = $("[data-testid=erp-count]");
  if(c) c.innerHTML = "<b>" + rows.length + "</b> order" + (rows.length === 1 ? "" : "s");
}

function refreshReasonCount(){
  const n = $("[data-testid=reason-count]");
  if(n) n.textContent = String(erpForm.cancelReason).trim().length;
}

function refreshPickRow(line){
  const row = $('[data-testid="pick-row-' + line + '"]');
  const req = $('[data-testid="req-' + line + '"]');
  if(!row || !req) return;
  const got = Number(wmsForm.picks[line]);
  row.classList.toggle("short", got < Number(req.textContent));
}

/* ---------- the one field writer ---------- */
function writeField(el){
  const val = el.type === "checkbox" ? el.checked : el.value;

  if(el.hasAttribute("data-lfield")){
    loginDraft[el.getAttribute("data-lfield")] = val;
    return true;
  }

  if(el.hasAttribute("data-cfield")){
    const k = el.getAttribute("data-cfield");
    const c = ensureCheckout();
    if(el.type === "radio" && !el.checked) return false;
    c[k] = val;
    delete shopErrors[k];
    save();
    return LIVE.cfield.indexOf(k) >= 0 ? "render" : true;
  }

  if(el.hasAttribute("data-efield")){
    const k = el.getAttribute("data-efield");
    if(["q","status","hold","country","from","to"].indexOf(k) >= 0){
      if(k === "from" || k === "to"){
        /* keep exactly what was typed so that a re-render never rewrites it,
           and filter on the parsed date only once it is a complete date */
        erpFilters[k + "Raw"] = val;
        erpFilters[k] = ukToISO(val) || "";
      }else{
        erpFilters[k] = val;
      }
    }else{
      erpForm[k] = val;
    }
    if(PARTIAL.efield[k]){ try{ PARTIAL.efield[k](); }catch(e){} return true; }
    return LIVE.efield.indexOf(k) >= 0 ? "render" : true;
  }

  if(el.hasAttribute("data-wfield")){
    const k = el.getAttribute("data-wfield");
    if(k === "pick"){
      const line = el.getAttribute("data-line");
      wmsForm.picks[line] = val;
      try{ refreshPickRow(line); }catch(e){}
      return true;
    }
    wmsForm[k] = val;
    return LIVE.wfield.indexOf(k) >= 0 ? "render" : true;
  }

  return false;
}

function handleFieldEvent(el){
  const r = writeField(el);
  if(r === "render") render();
  return r !== false;
}

document.addEventListener("input", ev => {
  const el = ev.target;
  if(!el || !el.tagName) return;
  if(handleFieldEvent(el)) return;
  handleLooseInput(el);
});

document.addEventListener("change", ev => {
  const el = ev.target;
  if(!el || !el.tagName) return;
  if(handleFieldEvent(el)) return;
  handleLooseInput(el);
});

/* Controls that are not backed by a draft field. */
function handleLooseInput(el){
  const act = el.getAttribute && el.getAttribute("data-act");
  if(!act) return;
  if(act === "filter-cat"){ shopFilter.cat = el.value; render(); return; }
  if(act === "filter-sort"){ shopFilter.sort = el.value; render(); return; }
  if(act === "pdp-axis"){ pdpSel[el.getAttribute("data-axis")] = el.value; render(); return; }
  if(act === "pdp-qty"){ pdpQty = Math.max(1, Math.min(10, Number(el.value) || 1)); return; }
  if(act === "promo-typed"){ state.basket.promo = el.value; save(); return; }
  if(act === "line-qty"){
    const i = Number(el.getAttribute("data-idx"));
    const l = state.basket.lines[i];
    if(!l) return;
    const p = productBySku(l.sku), v = variantOf(p, l.vid);
    let q = Math.max(1, Math.min(10, Number(el.value) || 1));
    if(q > v.stock){ q = v.stock; toast("Only " + v.stock + " of that option are available."); }
    l.qty = q; save(); render(); return;
  }
}

/* ---------- clicks ---------- */
/* A state changing click re-renders the page. The second click of a double
   click therefore lands on whichever control has moved into that position,
   which is how a double click used to remove two basket lines, or take a
   consignment from Despatched straight to Return requested in one gesture.
   The browser tells us which clicks belong to one gesture: the second click
   of a double carries detail 2. A tool driving the page issues independent
   single clicks with detail 1, so nothing legitimate is dropped. */
const GUARDED_ACTS = ["place-order", "erp-release", "erp-cancel", "line-remove",
  "line-minus", "line-plus", "promo-apply", "promo-remove", "wms-confirm-pick",
  "wms-cancel-pick", "wms-damage", "wms-pack", "wms-despatch", "wms-delivered",
  "wms-failed", "wms-return", "wms-return-received"];

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.getAttribute("data-act");
  const ref = el.getAttribute("data-ref");
  const dn  = el.getAttribute("data-dn");

  if(ev.detail > 1 && GUARDED_ACTS.indexOf(act) >= 0) return;

  switch(act){
    /* shell */
    case "nav":      ev.preventDefault(); go(el.getAttribute("data-href")); break;
    case "apps":     go("#/apps"); break;
    case "signout":  signOut(); break;
    case "theme":    toggleTheme(); break;
    case "reset":
      resetDemo();
      shopFilter = { cat:"All", sort:"featured" };
      shopStep = 1; shopErrors = {}; shopBanner = null;
      erpFilters = { q:"", status:"All", hold:"All", country:"All", from:"", to:"", fromRaw:"", toRaw:"" };
      erpForm = { cancelReason:"", partial:false }; erpBanner = null; erpTab = "header";
      wmsForm = { picks:{}, damageLine:"", damageNote:"", trackQuery:"", failReason:"" }; wmsBanner = null;
      toast("Demo data reset.");
      go("#/apps");
      break;
    case "open-app": openApp(el.getAttribute("data-app")); break;

    /* storefront */
    case "scroll-products": { const t = $("#products"); if(t) t.scrollIntoView({ behavior:"smooth", block:"start" }); break; }
    case "open-product": pdpSel = {}; pdpQty = 1; shopErrors = {}; go("#/shop/product/" + el.getAttribute("data-sku")); break;
    case "pdp-minus": pdpQty = Math.max(1, pdpQty - 1); render(); break;
    case "pdp-plus":  pdpQty = Math.min(10, pdpQty + 1); render(); break;
    case "add-basket": addToBasket(el.getAttribute("data-sku")); break;
    case "line-minus": { const i = Number(el.getAttribute("data-idx")); const l = state.basket.lines[i];
      if(l){ l.qty = Math.max(1, l.qty - 1); save(); render(); } break; }
    case "line-plus": { const i = Number(el.getAttribute("data-idx")); const l = state.basket.lines[i];
      if(l){ const v = variantOf(productBySku(l.sku), l.vid);
        if(l.qty + 1 > 10) toast("A maximum of 10 units of one item may be bought in a single order.");
        else if(l.qty + 1 > v.stock) toast("Only " + v.stock + " of that option are available.");
        else { l.qty += 1; save(); } render(); } break; }
    case "line-remove": { const i = Number(el.getAttribute("data-idx"));
      state.basket.lines.splice(i, 1); if(!state.basket.lines.length){ state.basket.promoCode = ""; state.basket.promo = ""; }
      save(); shopBanner = null; render(); break; }
    case "promo-apply": applyPromo(); break;
    case "promo-remove": state.basket.promoCode = ""; state.basket.promo = ""; shopBanner = null; save(); render(); break;
    case "to-checkout":
      if(!state.basket.lines.length){ shopBanner = { kind:"risk", code:"EC-V01", text:"Your basket is empty." }; render(); break; }
      ensureCheckout(); shopStep = 1; shopErrors = {}; shopBanner = null; go("#/shop/checkout"); break;
    case "co-next":
      shopBanner = null;
      if(validateCheckoutStep(shopStep)) shopStep = Math.min(3, shopStep + 1);
      render(); break;
    case "co-back": shopBanner = null; shopErrors = {}; shopStep = Math.max(1, shopStep - 1); render(); break;
    case "place-order": placeOrder(); break;
    case "open-erp-order":
      if(!hasSystem("erp")){ toast("Your role does not have access to the ERP."); break; }
      erpTab = "header"; erpBanner = null; go("#/erp/order/" + ref); break;

    /* erp */
    case "open-order": erpTab = "header"; erpBanner = null; erpForm = { cancelReason:"", partial:false };
      go("#/erp/order/" + (ref || el.getAttribute("data-ref"))); break;
    case "erp-tab": erpTab = el.getAttribute("data-tab"); render(); break;
    case "erp-clear": erpFilters = { q:"", status:"All", hold:"All", country:"All", from:"", to:"", fromRaw:"", toRaw:"" }; render(); break;
    case "erp-release": erpRelease(ref); break;
    case "erp-cancel": erpCancel(ref); break;
    case "open-dn": go("#/wms/delivery/" + el.getAttribute("data-dn")); break;

    /* wms */
    case "wms-confirm-pick": wmsConfirmPick(dn); break;
    case "wms-cancel-pick": wmsCancelPick(dn); break;
    case "wms-damage": wmsDamage(dn); break;
    case "wms-pack": wmsPack(dn); break;
    case "wms-despatch": wmsDespatch(dn); break;
    case "wms-delivered": wmsDelivered(dn); break;
    case "wms-failed": wmsFailed(dn); break;
    case "wms-return": wmsReturn(dn); break;
    case "wms-return-received": wmsReturnReceived(dn); break;
    case "wms-track": render(); break;
  }
});

/* Submitting the sign in form. */
document.addEventListener("submit", ev => {
  if(ev.target && ev.target.id === "login-form"){ ev.preventDefault(); attemptLogin(); }
});

/* ---------- router ---------- */
function render(){
  applyTheme();
  if(!state.session){ renderLogin(); return; }

  const p = routeParts();
  const head = p[0] || "apps";

  if(head === "shop"){
    const sub = p[1] || "";
    if(sub === "product") return viewProduct(p[2]);
    if(sub === "basket")  return viewBasket();
    if(sub === "checkout")return viewCheckout();
    if(sub === "confirm") return viewConfirm(p[2]);
    return viewShopHome();
  }

  if(head === "erp"){
    if(!hasSystem("erp")){ toast("Your role does not have access to the ERP."); go("#/apps"); return; }
    const sub = p[1] || "orders";
    if(sub === "order")     return viewErpOrder(p[2]);
    if(sub === "holds")     return viewErpHolds();
    if(sub === "customers") return viewErpCustomers();
    return viewErpOrders();
  }

  if(head === "wms"){
    if(!hasSystem("wms")){ toast("Your role does not have access to the warehouse system."); go("#/apps"); return; }
    const sub = p[1] || "work";
    if(sub === "pick")     return viewWmsPick(p[2]);
    if(sub === "pack")     return viewWmsPack(p[2]);
    if(sub === "despatch") return viewWmsDespatch(p[2]);
    if(sub === "delivery") return viewWmsDelivery(p[2]);
    if(sub === "track")    return viewWmsTrack();
    if(sub === "returns")  return viewWmsReturns();
    return viewWmsWork();
  }

  return renderLauncher();
}

window.addEventListener("hashchange", () => { render(); });

/* ---------- boot ---------- */
load();
applyTheme();
if(!location.hash) location.hash = "#/apps";
render();

</script>
